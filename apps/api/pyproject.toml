[project]
name = "cartlyf-api"
version = "0.0.0"
description = "Cartlyf REST API and background worker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cartlyf-engine",
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "structlog",
  "dramatiq[redis]",
  "argon2-cffi>=25.1.0",
  "pyjwt>=2.15.1",
  "redis>=8.1.0",
  "email-validator>=2.3.0",
  "tzdata>=2026.5",
  "minio>=7.2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartlyf_api"]

[tool.uv.sources]
cartlyf-engine = { workspace = true }
