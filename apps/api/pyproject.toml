[project]
name = "cartlyf-api"
version = "0.0.0"
description = "Cartlyf REST API and background worker."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cartlyf-engine",
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "structlog",
  "dramatiq[redis]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartlyf_api"]

[tool.uv.sources]
cartlyf-engine = { workspace = true }
