[project]
name = "cartlyf-engine"
version = "0.0.0"
description = "Pure scheduling engine: domain, constraint templates, CP-SAT compiler, checker."
requires-python = ">=3.12,<3.13"
dependencies = ["ortools>=9.12", "pydantic>=2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartlyf_engine"]
