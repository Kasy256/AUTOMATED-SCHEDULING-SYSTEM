[project]
name = "cartlyf"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cartlyf-engine"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/engine"]

[tool.uv.sources]
cartlyf-engine = { workspace = true }

[dependency-groups]
dev = ["ruff", "pyright", "pytest", "hypothesis"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ISBAT-TIMETABLE-BACKEND", "ISBAT-TIMETABLE-FRONTEND", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pyright]
include = ["packages/engine"]
exclude = ["**/.venv", "**/__pycache__"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["packages/engine/tests"]
addopts = "--import-mode=importlib"
markers = ["integration: needs Docker (Testcontainers)"]
