name: CI

on:
  push:
    branches: [Development, main, "phase/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on a deploying branch: it may be part-way through a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/Development' && github.ref != 'refs/heads/main' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -v

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # The API exports the OpenAPI schema that orval generates the client from.
      - run: uv sync --frozen --no-dev
        working-directory: .
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
        working-directory: .
      # The example values are throwaway local credentials, fine for an isolated CI stack.
      - run: cp .env.example .env
        working-directory: .
      - run: docker compose up -d --wait postgres redis minio
        working-directory: .
      # One-shot container that creates the bucket and exits.
      - run: docker compose up minio-init
        working-directory: .
      - run: uv run alembic -c apps/api/alembic.ini upgrade head
        working-directory: .
        env:
          CARTLYF_MIGRATION_DATABASE_URL: postgresql+asyncpg://cartlyf_owner:change-me-owner@127.0.0.1:5432/cartlyf
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate
      - run: pnpm exec playwright install --with-deps chromium
      # The planner flows solve timetables, which runs on the Dramatiq worker.
      - name: Start the solve worker
        run: nohup uv run --env-file .env dramatiq cartlyf_api.jobs.worker --processes 1 --threads 1 > worker.log 2>&1 &
        working-directory: .
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            worker.log
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1
          -c 'git config --global --add safe.directory /repo && cd /repo && gitleaks git . --redact --verbose'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pip-audit --skip-editable
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm audit
        working-directory: apps/web

  # Development -> staging, main -> production (the production environment requires a reviewer).
  # Each GitHub environment (staging, production) needs:
  #   secrets: RENDER_API_KEY, CLOUDFLARE_API_TOKEN (Pages: Edit)
  #   vars:    RENDER_MIGRATE_SERVICE_ID, RENDER_WORKER_SERVICE_ID, RENDER_API_SERVICE_ID,
  #            RENDER_EMAIL_RETRY_SERVICE_ID,
  #            CLOUDFLARE_ACCOUNT_ID, PAGES_PROJECT, PAGES_BRANCH (main for production),
  #            API_URL (https://api[-staging].<domain>), WEB_URL (https://app[-staging].<domain>),
  #            VITE_SENTRY_DSN (the web project's public DSN)
  deploy:
    needs: [python, web, e2e, security]
    # Off until hosting exists: set the repository variable DEPLOY_ENABLED=true to turn it on.
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/Development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SHA: ${{ github.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Release step: migrations as cartlyf_owner, before any new app code takes traffic.
      # The owner URL lives only on the migrate service; the job uses its latest build.
      - name: Build the migrate service
        run: python3 tools/render_deploy.py deploy "${{ vars.RENDER_MIGRATE_SERVICE_ID }}" "$SHA"
      - name: Migrate
        run: >
          python3 tools/render_deploy.py job "${{ vars.RENDER_MIGRATE_SERVICE_ID }}"
          alembic -c apps/api/alembic.ini upgrade head

      - name: Deploy the worker
        run: python3 tools/render_deploy.py deploy "${{ vars.RENDER_WORKER_SERVICE_ID }}" "$SHA"
      - name: Deploy the API
        run: python3 tools/render_deploy.py deploy "${{ vars.RENDER_API_SERVICE_ID }}" "$SHA"
      - name: Deploy the email re-delivery cron
        run: python3 tools/render_deploy.py deploy "${{ vars.RENDER_EMAIL_RETRY_SERVICE_ID }}" "$SHA"

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # The API exports the OpenAPI schema that orval generates the client from.
      - run: uv sync --frozen --no-dev
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Build the web app
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.API_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
          VITE_RELEASE: ${{ github.sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm api:generate
          pnpm build
      - name: Deploy the web app to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm dlx wrangler@4.149.0 pages deploy dist
          --project-name "${{ vars.PAGES_PROJECT }}" --branch "${{ vars.PAGES_BRANCH }}"
          --commit-hash "$SHA"

      - name: Smoke test
        run: python3 tools/smoke.py "${{ vars.API_URL }}" "${{ vars.WEB_URL }}"
