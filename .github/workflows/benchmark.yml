name: Engine benchmark

# ENG-08 and EDU-05 need a 4 vCPU machine; run on demand by pushing a `bench-*` tag.
on:
  workflow_dispatch:
  push:
    tags: ["bench-*"]

permissions:
  contents: read

jobs:
  eng-08:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Machine
        run: |
          echo "::notice title=Machine::$(nproc) vCPU, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
      - name: ENG-08
        run: |
          set -o pipefail
          uv run pytest -m benchmark -s packages/engine/tests/test_ENG_08_benchmark.py 2>&1 | tee bench.log
      - name: Result
        if: always()
        run: echo "::notice title=ENG-08::$(grep -m1 'ENG-08 status' bench.log || tail -n 3 bench.log | tr '\n' ' ')"
      - name: EDU-05
        if: always()
        run: |
          set -o pipefail
          uv run pytest -m benchmark -s packages/engine/tests/test_EDU_isbat.py 2>&1 | tee edu.log
          echo "::notice title=EDU-05::$(grep -m1 'EDU-05 status' edu.log || tail -n 3 edu.log | tr '\n' ' ')"
